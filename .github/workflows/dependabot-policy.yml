name: Dependabot Policy

on:
  pull_request:
    paths:
      - ".github/dependabot.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependabot-policy.yml"
  push:
    branches:
      - main
    paths:
      - ".github/dependabot.yml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/dependabot-policy.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3.7.0

      - name: Validate Dependabot policy
        uses: DiogoRibeiro7/safe-dependabot@v1
